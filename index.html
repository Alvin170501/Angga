<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxdiss Pro Dashboard</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-base: #0f172a;
            --bg-panel: #1e293b;
            --bg-input: #0b1120;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --border: rgba(255, 255, 255, 0.08);
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* Dashboard Layout */
        .dashboard {
            width: 100%;
            max-width: 900px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 1.5rem;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border);
        }

        header h1 {
            margin: 0;
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            background: rgba(99, 102, 241, 0.15);
            color: #818cf8;
            padding: 0.4rem 0.8rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* Grid Cards */
        .grid-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        @media (max-width: 600px) {
            .grid-container { grid-template-columns: 1fr; }
        }

        .card {
            background: var(--bg-panel);
            border-radius: 24px;
            padding: 2rem;
            border: 1px solid var(--border);
            box-shadow: var(--shadow);
        }

        /* Input Section */
        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-group label {
            display: block;
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        input[type="number"] {
            width: 100%;
            padding: 16px;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 16px;
            color: white;
            font-size: 1.2rem;
            box-sizing: border-box;
            outline: none;
            transition: border 0.3s ease;
        }

        input[type="number"]:focus {
            border-color: var(--primary);
        }

        /* Buttons */
        .btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn-start {
            background: var(--primary);
            color: white;
        }

        .btn-start:hover { background: var(--primary-hover); }

        .btn-stop {
            background: rgba(239, 68, 68, 0.1);
            color: var(--accent-danger);
            border: 1px solid rgba(239, 68, 68, 0.2);
            display: none;
        }

        .btn-stop:hover { background: rgba(239, 68, 68, 0.2); }

        /* Timer Display Area */
        .timer-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .time-display {
            font-size: 5rem;
            font-weight: 800;
            color: var(--text-main);
            font-variant-numeric: tabular-nums;
            line-height: 1;
            margin: 1rem 0;
            transition: color 0.3s ease;
        }

        .time-display.running {
            color: var(--accent-success);
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.4);
        }

        .time-display.finished {
            color: var(--accent-danger);
            animation: pulse 1s infinite;
        }

        /* Progress Bar */
        .progress-wrapper {
            width: 100%;
            height: 8px;
            background: var(--bg-input);
            border-radius: 10px;
            overflow: hidden;
            margin-top: 1rem;
        }

        .progress-bar {
            height: 100%;
            width: 100%;
            background: var(--accent-success);
            transition: width 0.5s linear, background 0.3s ease;
        }

        .status {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-top: 1rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 600;
        }

        /* Info Panel */
        .info-panel {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: center;
        }

        .info-item {
            text-align: center;
        }

        .info-value {
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-success);
            letter-spacing: 1px;
        }

        .info-label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 6px;
        }

        /* Link WhatsApp Style */
        .wa-link {
            color: #818cf8; /* Warna ungu kebiruan senada tema */
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .wa-link:hover {
            color: var(--accent-success); /* Berubah hijau saat disentuh/hover */
            text-decoration: underline;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>

<div class="dashboard">
    <header>
        <h1>Maxdiss Pro</h1>
        <div class="badge">instagram : @alviannnnm</div>
    </header>

    <div class="grid-container">
        <!-- Panel Konfigurasi -->
        <div class="card">
            
            <!-- Panel Info Diperbarui -->
            <div class="info-panel">
                <div class="info-item">
                    <div class="info-value"> SEMANGAT PAGI!!! </div>
                    <!-- Tautan WhatsApp Ditambahkan di Sini -->
                    <div class="info-label">
                        <a href="https://wa.me/628163633999" target="_blank" class="wa-link">Klik ini untuk memberikan kritik dan saran</a>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label for="itemInput">Jumlah Item yang diproses</label>
                <input type="number" id="itemInput" placeholder="Masukkan angka..." min="1">
            </div>
            
            <button class="btn btn-start" id="startBtn" onclick="startTimer()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                Mulai Hitung Mundur
            </button>
            <button id="stopBtn" class="btn btn-stop" onclick="stopEverything()">
                <svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M9 10a1 1 0 011-1h4a1 1 0 011 1v4a1 1 0 01-1 1h-4a1 1 0 01-1-1v-4z"></path></svg>
                Hentikan Proses
            </button>
        </div>

        <!-- Panel Display -->
        <div class="card timer-container">
            <div class="status" id="statusLabel">Status: STANDBY</div>
            <div class="time-display" id="timeDisplay">00:00</div>
            
            <div class="progress-wrapper">
                <div class="progress-bar" id="progressBar"></div>
            </div>
        </div>
    </div>
</div>

<script>
    let timer = null;
    let alarmInstance = null;
    let totalDurasiAwal = 0;
    let targetWaktuSelesai = 0;

    const display = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const stopBtn = document.getElementById('stopBtn');
    const startBtn = document.getElementById('startBtn');
    const progressBar = document.getElementById('progressBar');
    const itemInput = document.getElementById('itemInput');

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        const input = itemInput.value;
        let totalSeconds = parseInt(input) * 5;

        if (isNaN(totalSeconds) || totalSeconds <= 0) {
            alert("Harap masukkan jumlah item yang valid!");
            return;
        }

        // Reset & inisialisasi
        bersihkanAudio();
        if(timer) clearInterval(timer);
        
        totalDurasiAwal = totalSeconds;
        
        // Catat target waktu akhir menggunakan jam sistem agar anti-ngaret
        targetWaktuSelesai = Date.now() + (totalSeconds * 1000);
        
        // Ubah UI
        statusLabel.innerText = "Status: BERJALAN...";
        statusLabel.style.color = "var(--primary)";
        startBtn.style.display = "none"; 
        stopBtn.style.display = "flex"; 
        
        display.classList.add('running');
        display.classList.remove('finished');
        display.innerText = formatTime(totalSeconds);
        
        itemInput.disabled = true;
        itemInput.style.opacity = "0.5";

        timer = setInterval(() => {
            const waktuSekarang = Date.now();
            let sisaDetik = Math.ceil((targetWaktuSelesai - waktuSekarang) / 1000);
            
            if (sisaDetik < 0) sisaDetik = 0;
            
            // Update Text & Progress Bar
            if (sisaDetik > 0) {
                display.innerText = formatTime(sisaDetik);
                
                const persentase = (sisaDetik / totalDurasiAwal) * 100;
                progressBar.style.width = `${persentase}%`;
                
                if(persentase < 25) {
                    progressBar.style.background = "var(--accent-danger)";
                } else if (persentase < 50) {
                    progressBar.style.background = "#f59e0b";
                }
                
            } else {
                display.innerText = "00:00";
                clearInterval(timer);
                finishTimer();
            }
        }, 300); // Diperbarui lebih sering agar gerakan waktu mulus
    }

    function finishTimer() {
        statusLabel.innerText = "Status: SELESAI!";
        statusLabel.style.color = "var(--accent-danger)";
        
        display.classList.remove('running');
        display.classList.add('finished');
        progressBar.style.width = "0%";
        
        // Menggunakan file musik1.mp3
        alarmInstance = new Audio("musik1.mp3");
        alarmInstance.loop = true;
        
        alarmInstance.play().catch(e => {
            console.log("Browser memblokir autoplay audio.");
        });
    }

    function stopEverything() {
        if(timer) clearInterval(timer);
        timer = null;
        
        bersihkanAudio();
        
        // Reset UI
        statusLabel.innerText = "Status: STANDBY";
        statusLabel.style.color = "var(--text-muted)";
        
        display.classList.remove('running', 'finished');
        display.innerText = "00:00";
        
        progressBar.style.width = "100%";
        progressBar.style.background = "var(--accent-success)";
        
        startBtn.style.display = "flex";
        stopBtn.style.display = "none";
        
        itemInput.disabled = false;
        itemInput.style.opacity = "1";
        itemInput.value = "";
    }

    function bersihkanAudio() {
        if (alarmInstance) {
            alarmInstance.pause();
            alarmInstance.src = "";
            alarmInstance.load();
            alarmInstance = null;
        }
    }
</script>
</body>
</html>
