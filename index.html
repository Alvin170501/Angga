<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxdiss buatan ilham</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 28px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 350px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        h2 { margin-bottom: 0.5rem; font-size: 1.5rem; letter-spacing: -0.025em; }
        p { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; }

        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            font-size: 1.1rem;
            color: white;
            text-align: center;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
            margin-bottom: 1rem;
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 14px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); display: none; }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 20px;
            border: 1px dashed #334155;
        }

        .time-display {
            font-size: 3rem;
            font-weight: 800;
            font-family: monospace;
            color: var(--accent);
        }

        .status { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; text-transform: uppercase; }

        .is-running { border: 1px solid var(--accent) !important; }
    </style>
</head>
<body>

<div class="container">
    <h2>Maxdiss buatan ilham</h2>
    <p>1 Item = 5 Detik</p>
    
    <input type="number" id="itemInput" placeholder="Jumlah Item">
    
    <div class="btn-group">
        <button class="btn-start" id="startBtn" onclick="startTimer()">Mulai</button>
        <button id="stopBtn" class="btn-stop" onclick="stopEverything()">Stop</button>
    </div>

    <div class="result-box" id="resultBox">
        <div class="time-display" id="timeDisplay">00:00</div>
        <div class="status" id="statusLabel">Standby</div>
    </div>
</div>

<audio id="alarmSound" src="musik.mp3" preload="auto" loop></audio>

<script>
    let timer = null;
    const alarm = document.getElementById('alarmSound');
    const display = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const box = document.getElementById('resultBox');
    const stopBtn = document.getElementById('stopBtn');
    const startBtn = document.getElementById('startBtn');

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        const input = document.getElementById('itemInput').value;
        let totalSeconds = parseInt(input) * 5;

        if (isNaN(totalSeconds) || totalSeconds <= 0) {
            alert("Masukkan jumlah item!");
            return;
        }

        // PASTIKAN AUDIO MATI TOTAL SEBELUM MULAI
        alarm.pause();
        alarm.currentTime = 0;
        
        if(timer) clearInterval(timer);
        
        statusLabel.innerText = "Running...";
        statusLabel.style.color = "#10b981";
        box.classList.add('is-running');
        
        startBtn.style.display = "none"; 
        stopBtn.style.display = "block"; 

        display.innerText = formatTime(totalSeconds);

        timer = setInterval(() => {
            totalSeconds--;
            if (totalSeconds >= 0) {
                display.innerText = formatTime(totalSeconds);
            } else {
                clearInterval(timer);
                finishTimer();
            }
        }, 1000);
    }

    function finishTimer() {
        statusLabel.innerText = "Waktu Habis!";
        statusLabel.style.color = "#ef4444";
        box.classList.remove('is-running');
        
        // HANYA DISINI MUSIK DIPUTAR
        alarm.play().catch(e => console.log("Audio play blocked"));
    }

    function stopEverything() {
        // MATIKAN TIMER
        if(timer) clearInterval(timer);
        timer = null;

        // MATIKAN MUSIK SECARA TOTAL
        alarm.pause();
        alarm.currentTime = 0;
        
        // RESET TAMPILAN
        statusLabel.innerText = "Standby";
        statusLabel.style.color = "#94a3b8";
        box.classList.remove('is-running');
        display.innerText = "00:00";
        
        startBtn.style.display = "block";
        stopBtn.style.display = "none";
        document.getElementById('itemInput').value = "";
    }
</script>

</body>
</html>
