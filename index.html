<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maxdiss Pro - Fix Musik</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #10b981;
            --danger: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background: var(--card-bg);
            padding: 2rem;
            border-radius: 28px;
            width: 100%;
            max-width: 320px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
        }

        input {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #334155;
            border-radius: 14px;
            color: white;
            text-align: center;
            margin-bottom: 1rem;
            box-sizing: border-box;
            outline: none;
        }

        .btn-group { display: flex; gap: 10px; }

        button {
            flex: 1;
            padding: 14px;
            color: white;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-start { background: var(--primary); }
        .btn-stop { background: var(--danger); display: none; }

        .result-box {
            margin-top: 1.5rem;
            padding: 1.5rem;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 20px;
        }

        .time-display { font-size: 3rem; font-weight: 800; color: var(--accent); }
        .status { font-size: 0.75rem; color: var(--text-muted); margin-top: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h2>Maxdiss buatan ilham</h2>
    <p>1 Item = 5 Detik</p>
    <input type="number" id="itemInput" placeholder="Jumlah Item">
    
    <div class="btn-group">
        <button class="btn-start" id="startBtn" onclick="startTimer()">Mulai</button>
        <button id="stopBtn" class="btn-stop" onclick="stopEverything()">Stop</button>
    </div>

    <div class="result-box">
        <div class="time-display" id="timeDisplay">00:00</div>
        <div class="status" id="statusLabel">Standby</div>
    </div>
</div>

<script>
    let timer = null;
    let alarmInstance = null; // Objek audio akan disimpan di sini nanti

    const display = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const stopBtn = document.getElementById('stopBtn');
    const startBtn = document.getElementById('startBtn');

    function formatTime(seconds) {
        const m = Math.floor(seconds / 60);
        const s = seconds % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
    }

    function startTimer() {
        const input = document.getElementById('itemInput').value;
        let totalSeconds = parseInt(input) * 5;

        if (isNaN(totalSeconds) || totalSeconds <= 0) return;

        // Reset segalanya sebelum mulai
        bersihkanAudio();
        if(timer) clearInterval(timer);
        
        statusLabel.innerText = "Running...";
        startBtn.style.display = "none"; 
        stopBtn.style.display = "block"; 

        display.innerText = formatTime(totalSeconds);

        timer = setInterval(() => {
            totalSeconds--;
            if (totalSeconds >= 0) {
                display.innerText = formatTime(totalSeconds);
            } else {
                clearInterval(timer);
                finishTimer();
            }
        }, 1000);
    }

    function finishTimer() {
        statusLabel.innerText = "Waktu Habis!";
        
        // BUAT OBJEK AUDIO BARU HANYA DI SINI
        // Ini trik supaya aplikasi gak autostart pas awal
        alarmInstance = new Audio("musik.mp3");
        alarmInstance.loop = true;
        
        // Mainkan
        alarmInstance.play().catch(e => {
            console.log("Audio play diproteksi sistem");
        });
    }

    function stopEverything() {
        if(timer) clearInterval(timer);
        timer = null;
        
        bersihkanAudio();
        
        statusLabel.innerText = "Standby";
        display.innerText = "00:00";
        startBtn.style.display = "block";
        stopBtn.style.display = "none";
        document.getElementById('itemInput').value = "";
    }

    function bersihkanAudio() {
        if (alarmInstance) {
            alarmInstance.pause();
            alarmInstance.src = ""; // Buang path file agar tidak nyangkut di memori
            alarmInstance.load();
            alarmInstance = null; // Hancurkan objeknya
        }
    }
</script>
</body>
</html>
